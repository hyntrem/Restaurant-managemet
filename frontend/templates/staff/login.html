<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza 4P's - Staff Login</title>
  <link rel="stylesheet" href="../../static/css/auth.css">
</head>
<body>
  <div class="auth-container staff-bg">
    <div class="auth-box">
      <h1>Pizza 4P's</h1>
      <h2>Staff Login</h2>

      <input type="text" id="username" placeholder="Tài khoản nhân viên">
      <input type="password" id="password" placeholder="Mật khẩu">

      <button onclick="staffLogin()">Đăng nhập nội bộ</button>

      <p id="message"></p>
    </div>
  </div>

  <script src="../../static/js/staff-auth.js"></script>
</body>
</html>
