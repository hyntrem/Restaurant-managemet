<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khôi phục mật khẩu | Pizza 4P's</title>
  <link rel="stylesheet" href="../../static/css/auth.css?v=2">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: { preflight: false }
    }
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">
  <style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <div class="auth-box">
      <h1><a href="home.html" style="text-decoration: none; color: inherit;">Pizza 4P's</a></h1>
      <h2>Khôi phục mật khẩu</h2>

      <!-- Step 1: Request OTP -->
      <div id="request-otp-section">
        <input type="text" id="username" placeholder="Tên đăng nhập" required>
        <input type="tel" id="phone" placeholder="Số điện thoại" required>
        <button id="send-otp-btn" onclick="triggerResetOtp()" style="margin-bottom: 10px;">Gửi OTP</button>
        <p id="message" style="color: red;"></p>
        <p style="margin-top: 15px;">Quay lại <a href="login.html">Đăng nhập</a></p>
      </div>

      <!-- Step 2: New Password (Hidden initially) -->
      <div id="new-password-section" style="display: none;">
        <input type="password" id="new-password" placeholder="Mật khẩu mới" required>
        <input type="password" id="confirm-password" placeholder="Xác nhận mật khẩu mới" required>
        <button id="reset-password-btn" onclick="submitNewPassword()">Xác nhận đổi mật khẩu</button>
        <p id="reset-message" style="color: red; margin-bottom: 15px;"></p>
      </div>
    </div>
  </div>

  <!-- Include customer-common.js which contains the OTP Modal UI logic -->
  <script src="../../static/js/customer/customer-common.js"></script>
  <script src="../../static/js/customer/customer-auth.js"></script>
</body>

</html>
