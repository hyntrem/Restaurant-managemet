<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập | Pizza 4P's</title>
  <link rel="stylesheet" href="../../static/css/auth.css?v=2">
</head>

<body>
  <div class="auth-container">
    <div class="auth-box">
      <h1><a href="home.html" style="text-decoration: none; color: inherit;">Pizza 4P's</a></h1>
      <h2>Đăng Nhập</h2>

      <input type="text" id="username" placeholder="Tên đăng nhập">
      <input type="password" id="password" placeholder="Mật khẩu">

      <button onclick="customerLogin()">Đăng nhập</button>

      <p>Chưa có tài khoản? <a href="register.html">Đăng ký</a></p>
      <p id="message"></p>
    </div>
  </div>

  <script src="../../static/js/customer/customer-auth.js"></script>
</body>

</html>
