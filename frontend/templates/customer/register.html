<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký | Pizza 4P's</title>
  <link rel="stylesheet" href="../../static/css/auth.css?v=2">
</head>

<body>
  <div class="auth-container">
    <div class="auth-box">
      <h1><a href="home.html" style="text-decoration: none; color: inherit;">Pizza 4P's</a></h1>
      <h2>Đăng Ký</h2>

      <input type="text" id="fullName" placeholder="Họ và tên">
      <input type="text" id="username" placeholder="Tên đăng nhập">
      <input type="email" id="email" placeholder="Email">
      <input type="text" id="phone" placeholder="Số điện thoại">
      <input type="password" id="password" placeholder="Mật khẩu">

      <button onclick="customerRegister()">Đăng ký</button>

      <p>Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
      <p id="message"></p>
    </div>
  </div>

  <script src="../../static/js/customer/customer-auth.js"></script>
</body>

</html>
