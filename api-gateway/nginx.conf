events {}

http {
    server {
        listen 80;

        # =====================
        # USER SERVICE
        # =====================
        location /api/users/ {
            proxy_pass http://user-service:5001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # =====================
        # MENU SERVICE
        # =====================
        location /api/menu/ {
            proxy_pass http://menu-service:5002/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # =====================
        # INVENTORY SERVICE
        # =====================
        location /api/inventory/ {
            proxy_pass http://inventory-service:5003/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # =====================
        # ORDER SERVICE
        # =====================
        location /api/orders/ {
            proxy_pass http://order-service:5004/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # =====================
        # PAYMENT SERVICE
        # =====================
        location /api/payments/ {
            proxy_pass http://payment-service:5005/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # =====================
        # TABLE SERVICE
        # =====================
        location /api/tables/ {
            proxy_pass http://table-service:5006/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # =====================
        # BRANCH SERVICE
        # =====================
        location /api/branches/ {
            proxy_pass http://branch-service:5007/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # =====================
        # REPORT SERVICE
        # =====================
        location /api/reports/ {
            proxy_pass http://report-service:5008/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check gateway
        location / {
            return 200 "API Gateway is running";
        }
    }
}